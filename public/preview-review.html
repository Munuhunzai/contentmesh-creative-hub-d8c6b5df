<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Preview layout checks</title><style>body{margin:0;background:#ddd;font:14px system-ui}header{display:flex;gap:8px;padding:12px;background:white;flex-wrap:wrap}button{padding:10px}iframe{display:block;margin:20px auto;border:0;background:white;height:900px;width:390px}</style></head><body><header><span>Responsive preview check</span><button data-width="360">360 px</button><button data-width="390">390 px</button><button data-width="768">768 px</button><button data-width="1024">1024 px</button><button data-width="1440">1440 px</button></header><iframe title="Website preview" src="/"></iframe><script>document.querySelectorAll('button').forEach(button=>button.addEventListener('click',()=>document.querySelector('iframe').style.width=button.dataset.width+'px'));</script></body></html>
